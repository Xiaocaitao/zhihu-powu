    const views={home:{title:'首页',html:home},career:{title:'职业规划',html:()=>`<section class="view"><div class="view-head"><div><p class="eyebrow">CAREER COMPASS</p><h1>先看清方向，再决定怎么走。</h1><p class="view-intro">这里是从首页规划框生成的详细结果，之后可以继续追问和更新。</p></div><button class="primary" data-view="home">回到规划框</button></div><div class="grid"><div class="card"><div class="card-head"><h2>后端开发工程师</h2><span class="badge">探索中</span></div><div class="hero-card"><p>目标：半年内独立完成一个小型项目，每周投入 10 小时。</p><div class="meter"><i></i></div><div style="display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:12px"><span>规划完成度</span><span>2 / 5 个阶段</span></div></div><div class="card-head"><h2>能力地图</h2></div><div class="plan-grid"><div class="phase"><small>基础能力</small><h3>编程与计算机基础</h3><p>语言、数据结构、网络和操作系统。</p><div class="bar"><i style="width:75%"></i></div></div><div class="phase"><small>专业能力</small><h3>Web 服务开发</h3><p>API 设计、数据库和服务拆分。</p><div class="bar"><i style="width:38%"></i></div></div><div class="phase"><small>实践能力</small><h3>项目与部署</h3><p>完成一个可运行、可展示的小项目。</p><div class="bar"><i style="width:16%"></i></div></div></div></div><div><div class="card"><div class="card-head"><h2>Agent 的判断</h2></div><div style="padding:0 22px 22px"><p style="margin:0;color:var(--muted)">先用一个最小 API 验证兴趣，再进入数据库和部署学习。后续学习计划会从这份能力地图继续拆解。</p></div></div><div class="card" style="margin-top:18px"><div class="card-head"><h2>参考证据</h2><button class="link" data-view="knowledge">去知识库</button></div><div class="resource-list"><div class="resource"><div class="resource-icon">文</div><div class="resource-body"><strong>知乎从业经验摘要</strong><span>3 条来源 · 已加入规划</span></div></div><div class="resource"><div class="resource-icon">数</div><div class="resource-body"><strong>岗位能力关键词</strong><span>来自公开岗位资料</span></div></div></div></div></div></div></section>`},learning:{title:'我的学习',html:()=>`<section class="view"><div class="view-head"><div><p class="eyebrow">LEARNING PLAN</p><h1>今天学什么，完成标准是什么？</h1><p class="view-intro">学习计划来自  class="eyebrow">MY KNOWLEDGE BASE</p><h1>把资料放在一起，让 Agent 真正用起来。</h1><p class="view-intro">上传课程讲义、笔记和项目资料，后续对话可以围绕你的资料学习。</p></div><button class="primary" id="upload-button">＋ 上传资料</button></div><div class="grid"><div class="card"><div class="card-head"><h2>我的资料</h2><span style="color:var(--muted);font-size:12px">12 个文件</span></div><div class="search"><input placeholder="搜索资料名称或内容"><button class="secondary" data-toast="原型演示：执行资料搜索">搜索</button></div><div class="folder-grid"><button class="folder" data-toast="打开课程资料"><b>课程资料</b><span>6 个文件</span></button><button class="folder" data-toast="打开项目笔记"><b>项目笔记</b><span>4 个文件</span></button><button class="folder" data-toast="打开职业资料"><b>职业资料</b><span>2 个文件</span></button></div><div class="card-head"><h2>最近上传</h2></div><div class="resource-list"><div class="resource"><div class="resource-icon">PDF</div><div class="resource-body"><strong>计算机网络复习提纲.pdf</strong><span>课程资料 · 2.4 MB · 今天</span></div><em>已索引</em></div><div class="resource"><div class="resource-icon">MD</div><div class="resource-body"><strong>后端项目想法.md</strong><span>项目笔记 · 8 KB · 昨天</span></div><em>已索引</em></div><div class="resource"><div class="resource-icon">DOC</div><div class="resource-body"><strong>岗位 JD 摘录.docx</strong><span>职业资料 · 126 KB · 周一</span></div><em>已索引</em></div></div></div></div><div><div class="card"><div class="card-head"><h2>上传到知识库</h2></div><label class="upload" for="file-input"><span><strong>点击选择文件</strong><span>支持 PDF、Markdown、Word、PPT、Excel 等</span></span></label><div style="padding:0 22px 21px;color:var(--muted);font-size:12px">原型仅演示文件选择。正式版上传后会进入云端索引，并可被 Agent 检索。</div></div><div class="card" style="margin-top:18px"><div class="card-head"><h2>知识库能做什么</h2></div><div class="timeline"><div class="timeline-item"><i class="timeline-dot"></i><div><strong>问资料</strong><span>“根据我的网络笔记解释 TCP”</span></div></div><div class="timeline-item"><i class="timeline-dot" style="background:var(--green);box-shadow:0 0 0 4px #e5f8f0"></i><div><strong>做总结</strong><span>“把这章整理成复习清单”</span></div></div><div class="timeline-item"><i class="timeline-dot" style="background:var(--amber);box-shadow:0 0 0 4px #fff1de"></i><div><strong>生成任务</strong><span>“基于资料安排三天练习”</span></div></div></div></div></div></div></section>`},chat:{title:'对话记录',html:()=>`<section class="view"><div class="view-head"><div><p class="eyebrow">AGENT CONVERSATIONS</p><h1>每一次提问，都连接到你的成长目标。</h1><p class="view-intro">聊天是所有能力的统一入口，规划、学习和知识库上下文都可以继续使用。</p></div><button class="primary" data-view="home">＋ 新建任务</button></div><div class="grid"><div class="card"><div class="card-head"><h2>当前对话 · 学习反馈</h2><span style="color:var(--muted);font-size:12px">刚刚</span></div><div class="chat-window"><div class="bubble me">数据库这部分有点难，我这周只有 4 个小时。</div><div class="bubble">我会把任务拆小：先完成表结构和一条查询，再把 API 接起来。要不要我按 4 小时重新安排本周计划？</div></div><div class="chat-compose"><input id="chat-input" placeholder="告诉 Agent 你的目标、进度或困难"><button class="primary" id="chat-send">发送</button></div></div><div class="card"><div class="card-head"><h2>最近对话</h2></div><div class="conversation-list"><button class="conversation active"><strong>学习反馈：数据库任务偏难</strong><span>刚刚 · 已关联学习计划</span></button><button class="conversation"><strong>后端开发职业规划</strong><span>昨天 · 已保存规划</span></button><button class="conversation"><strong>HTTP 复习问题</strong><span>周一 · 已关联知识库</span></button></div></div></div></section>`}};
    function render(name){const item=views[name]||views.home;view.innerHTML=typeof item.html==='function'?item.html():item.html;crumb.textContent=item.title;document.querySelectorAll('.nav button,.side-link').forEach(b=>b.classList.toggle('active',b.dataset.view===name));bind();window.scrollTo(0,0)}
    function setMode(mode){selectedMode=mode;const data=modeText[mode];document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.mode===mode));const label=document.querySelector('#mode-label'),input=document.querySelector('#home-input');if(label)label.textContent=data.label;if(input)input.placeholder=data.placeholder;}
    function bind(){document.querySelectorAll(".interview-answer").forEach(input=>{if(input.dataset.counter)return;input.dataset.counter="1";const counter=document.createElement("span");counter.className="answer-count";counter.textContent=`${input.value.length} 字`;input.after(counter);input.addEventListener("input",()=>counter.textContent=`${input.value.length} 字`);});document.querySelectorAll('[data-view]').forEach(el=>{if(el.dataset.bound)return;el.dataset.bound='1';el.addEventListener('click',()=>render(el.dataset.view))});document.querySelectorAll('[data-mode]').forEach(el=>el.addEventListener('click',()=>setMode(el.dataset.mode)));document.querySelectorAll('[data-toast]').forEach(el=>el.addEventListener('click',()=>toastIt(el.dataset.toast)));document.querySelectorAll('.task').forEach(el=>el.addEventListener('click',()=>{el.classList.toggle('done');toastIt(el.classList.contains('done')?'任务已标记完成':'已恢复为进行中')}));const upload=document.querySelector('#upload-button');if(upload)upload.addEventListener('click',()=>document.querySelector('#file-input').click());const send=document.querySelector('#home-send');if(send)send.addEventListener('click',()=>{const input=document.querySelector('#home-input');if(!input.value.trim())return toastIt('先告诉 Agent 你的目标或问题');const result=document.querySelector('#home-result');document.querySelector('#result-title').textContent=`${modeText[selectedMode].label}草案已生成`;document.querySelector('#result-desc').textContent='已同步到左侧成长空间，可以继续补充问题或查看详细结果。';result.classList.add('show');document.querySelector('#career-status').textContent=selectedMode==='career'?'已生成':'探索中';toastIt('原型演示：结果已同步到左侧')});const chatSend=document.querySelector('#chat-send');if(chatSend)chatSend.addEventListener('click',()=>{const input=document.querySelector('#chat-input');if(!input.value.trim())return toastIt('先告诉 Agent 你遇到的问题');const bubble=document.createElement('div');bubble.className='bubble me';bubble.textContent=input.value.trim();document.querySelector('.chat-window').append(bubble);input.value='';toastIt('原型演示：消息已加入对话')})}
    document.querySelector('#file-input').addEventListener('change',e=>{const names=[...e.target.files].map(file=>file.name);if(names.length)toastIt(`已选择 ${names.length} 个文件（原型未上传）`)});render('home');
  </script>
  <script>
    document.addEventListener('click', event => {
      if (!event.target.closest('#home-send')) return;
      queueMicrotask(() => {
        const mode=[...document.querySelectorAll('[data-mode].selected')].at(-1)?.dataset.mode;
        const status={career:['.side-items .side-link:nth-child(1) small','已生成'],plan:['.side-items .side-link:nth-child(2) small','已生成'],knowledge:['.side-items .side-link:nth-child(4) small','已更新'],review:['.side-items .side-link:nth-child(2) small','待复盘']}[mode];
        if(status) document.querySelector(status[0]).textContent=status[1];
        const open={career:'career',plan:'learning',knowledge:'knowledge',review:'chat'}[mode];
        if(open) document.querySelector('#result-open')?.setAttribute('data-view',open);
      });
    });
  </script>
  <script>
    // 原型精简：详细成长入口只保留在“我的成长空间”，避免和主导航重复。
    document.querySelectorAll('.nav button[data-view="career"],.nav button[data-view="learning"],.nav button[data-view="knowledge"]').forEach(button=>button.remove());
    document.querySelectorAll('.feature-row').forEach(row=>row.remove());
    document.querySelectorAll('.side-section').forEach(section=>{if(section.textContent.trim()==='最近任务')section.textContent='最近学习任务'});
    document.addEventListener('click',()=>{document.querySelectorAll('.feature-row').forEach(row=>row.remove());document.querySelectorAll('.side-section').forEach(section=>{if(section.textContent.trim()==='最近任务')section.textContent='最近学习任务'});});
    document.querySelectorAll('.side-link[data-view="chat"]').forEach(button=>button.remove());
    document.querySelectorAll('.side-section').forEach(section=>{if(section.textContent.trim()==='最近学习任务'){section.nextElementSibling?.remove();section.remove()}});
    const chatNav=document.querySelector('.nav button[data-view="chat"]');
    if(chatNav) chatNav.innerHTML='<span>✦</span>会话记录';
  </script>

  views.interview={title:'模拟面试',html:()=>`<section class="view interview-view"><div class="view-head"><div><p class="eyebrow">AI MOCK INTERVIEW</p><h1>先练习，再走进真实面试。</h1><p class="view-intro">训练范围由你指定，回答会保存到当前面试。</p></div></div><div id="interview-root">正在读取面试会话…</div></section>`};
  render = name => { baseRender(name); if(name==='record') loadRecords(); if(name==='interview') loadInterviews(); };
  async function loadRecords(){const el=document.querySelector('#record-list');try{const d=await api('/api/evidence/records');const rows=d.records||d.items||(Array.isArray(d)?d:[]);document.querySelector('#record-count').textContent=`${rows.length} 条记录`;el.innerHTML=rows.length?`<div class="evidence-timeline">${rows.map(r=>`<div class="evidence-event"><i></i><div><strong>${esc(r.title||r.kind||'学习记录')}</strong><span>${fmt(r.occurredAt||r.createdAt)} · ${r.durationMinutes!=null?esc(r.durationMinutes)+' 分钟':'用时待记录'} · ${esc(r.source||'来源待记录')}</span></div></div>`).join('')}</div>`:'<p class="view-intro">还没有学习记录，完成一次学习后即可在这里查看。</p>';}catch(e){el.innerHTML=`<p class="view-intro">${esc(e.message)}。请通过项目服务地址打开页面。</p>`;}document.querySelector('#generate-review')?.addEventListener('click',async()=>{try{await api('/api/evidence/reviews',{method:'POST',body:JSON.stringify({from:new Date(Date.now()-604800000).toISOString(),to:new Date().toISOString()})});toastIt('阶段复盘已生成');}catch(e){toastIt(e.message);}});}
  const start=()=>`<article class="card module-body"><h2>开始一次模拟面试</h2><p class="view-intro">请填写训练类型、目标 ID 和题量。</p><div class="search"><select id="interview-kind"><option value="skills">能力</option><option value="job">岗位</option><option value="project">项目</option></select><input id="interview-target" placeholder="目标 ID"><input id="interview-count" type="number" min="1" max="20" value="5"><button class="primary" id="start-interview">开始面试</button></div></article>`;
  async function loadInterviews(){const root=document.querySelector('#interview-root');try{const d=await api('/api/evidence/interviews');const rows=d.interviews||d.items||(Array.isArray(d)?d:[]);const active=rows.find(x=>x.status==='active'||x.status==='in_progress');if(active){const id=active.interviewId||active.id;const s=await api(`/api/evidence/interviews/${encodeURIComponent(id)}`);const q=s.questions?.find(x=>!x.answer)||s.questions?.[0];root.innerHTML=`<article class="card module-body"><div class="card-head"><h2>模拟面试</h2><span class="badge">${esc(s.status||'进行中')}</span></div><p>${esc(q?.prompt||q?.question||'题目待生成')}</p><textarea id="answer-input" class="interview-answer" placeholder="输入你的回答"></textarea><button class="primary" id="submit-answer">提交回答</button><button class="secondary" id="finish-interview">结束面试</button><div id="answer-feedback" class="interview-feedback">回答提交后显示反馈。</div></article>`;root.querySelector('#submit-answer').onclick=async()=>{const answer=root.querySelector('#answer-input').value.trim();if(!answer)return toastIt('请先输入回答');try{await api(`/api/evidence/interviews/${encodeURIComponent(id)}/answers`,{method:'POST',body:JSON.stringify({questionId:q.questionId,answer})});root.querySelector('#answer-feedback').textContent='回答已提交，反馈正在生成。';}catch(e){toastIt(e.message);}};root.querySelector('#finish-interview').onclick=async()=>{try{await api(`/api/evidence/interviews/${encodeURIComponent(id)}/finish`,{method:'POST',body:'{}'});loadInterviews();}catch(e){toastIt(e.message);}};}else{root.innerHTML=start();root.querySelector('#start-interview')?.addEventListener('click',async()=>{const target=root.querySelector('#interview-target').value.trim();if(!target)return toastIt('请填写目标 ID');try{await api('/api/evidence/interviews',{method:'POST',body:JSON.stringify({target:{kind:root.querySelector('#interview-kind').value,id:target},questionCount:Number(root.querySelector('#interview-count').value)||5})});loadInterviews();}catch(e){toastIt(e.message);}});}}catch(e){root.innerHTML=`<div class="card module-body"><p class="view-intro">${esc(e.message)}。请通过项目服务地址打开页面。</p></div>`;}}
})();
</script>
<script>
  // Evidence & Interview 联调脚本：页面只负责采集输入、透传请求、展示服务端结果。
  // 接口与 docs/队员D-Evidence与Interview模块技术设计与接口契约.md 的 13 项工具一致；
  // 本脚本取代上方早期的 Evidence 原型脚本（那段只保留作对照，不再被调用）。
  (() => {
    const kindText = {
      activity: '学习活动', project_outcome: '项目成果', task_change: '任务变化',
      learning_feedback: '学习反馈', plan_adjustment: '计划调整',
      assessment_result: '阶段测试结果', interview_result: '面试结果'
    };
    const statusText = {
      active: '进行中', preparing: '准备中', preparation_failed: '题目生成失败',
      completed: '已完成', ended_early: '提前结束', succeeded: '已生成',
      failed: '生成失败', not_started: '尚未生成'
    };
    const verificationText = {
      no_evidence: '暂无证据', pending: '待评估', available: '已有可复核结论', needs_review: '需要重新评估'
    };
    const supportText = { insufficient: '证据不足', partial: '部分支持', supported: '支持' };

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { 'content-type': 'application/json', ...(options.headers || {}) }
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        const detail = payload?.error?.message || payload?.summary || payload?.error || ('请求失败（' + response.status + '）');
        throw new Error(String(detail));
      }
      return payload.data ?? payload;
    }
    const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const fmt = value => value ? new Date(value).toLocaleString('zh-CN', { dateStyle: 'medium', timeStyle: 'short' }) : '时间待记录';
    const rows = value => Array.isArray(value) ? value : [];
    const lines = (values, render) => values.length ? values.map(render).join('<br>') : '暂无';
    const offline = error => `<p class="view-intro">${esc(error.message)}。请通过项目服务地址打开本页面，而不是直接双击文件。</p>`;
    function coverageNote(coverage, range) {
      const scope = range && range.from && range.to ? `${fmt(range.from)} – ${fmt(range.to)}` : '';
      if (!coverage) return scope;
      const missing = rows(coverage.missing).map(item => item.source);
      return [scope, coverage.complete ? '来源完整' : `部分来源未覆盖：${missing.join('、')}`].filter(Boolean).join(' · ');
    }

    const baseRender = render;
    views.record = { title: '学习记录', html: () => `
      <section class="view evidence-view">
        <div class="view-head">
          <div><p class="eyebrow">LEARNING RECORD</p><h1>把每一次学习都留下来。</h1>
          <p class="view-intro">完成、卡点、成果和能力证据都来自本模块服务，页面不预设任何学习结论。</p></div>
          <div class="record-actions">
            <button class="secondary" id="generate-review">生成阶段复盘</button>
            <button class="primary" data-view="learning">查看学习计划　→</button>
          </div>
        </div>
        <div class="evidence-grid">
          <div class="evidence-stack">
            <article class="card">
              <div class="card-head"><h2>学习时间线</h2><span class="badge" id="record-count">加载中</span></div>
              <div class="module-body" id="record-list">正在读取学习记录…</div>
            </article>
            <article class="card">
              <div class="card-head"><h2>单条记录</h2></div>
              <div class="module-body" id="record-detail"><p class="view-intro">点击上方任意记录查看详情、待补关联和能力评估入口。</p></div>
            </article>
          </div>
          <article class="card">
            <div class="card-head"><h2>阶段复盘</h2><span class="badge" id="review-state">—</span></div>
            <div class="module-body review-copy" id="review-list">正在读取复盘…</div>
          </article>
        </div>
        <article class="card">
          <div class="card-head"><h2>能力证据</h2><span class="badge" id="skill-state">—</span></div>
          <div class="module-body evidence-list" id="skill-list">正在读取能力证据…</div>
        </article>
        <p class="view-intro" id="record-coverage"></p>
      </section>` };

    views.interview = { title: '模拟面试', html: () => `
      <section class="view interview-view">
        <div class="view-head">
          <div><p class="eyebrow">AI MOCK INTERVIEW</p><h1>先练习，再走进真实面试。</h1>
          <p class="view-intro">训练范围由你指定，回答会原样保存并生成可复查的反馈。</p></div>
        </div>
        <div id="interview-root">正在读取面试会话…</div>
      </section>` };

    render = name => {
      baseRender(name);
      if (name === 'record') loadRecords();
      if (name === 'interview') loadInterviews();
    };

    /* ------------------------------ 学习记录 ------------------------------ */
    async function loadRecords() {
      const listEl = document.querySelector('#record-list');
      const countEl = document.querySelector('#record-count');
      const coverageEl = document.querySelector('#record-coverage');
      document.querySelector('#generate-review').addEventListener('click', generateReview);
      try {
        const data = await api('/api/evidence/records?weekOf=' + encodeURIComponent(new Date().toISOString()));
        const list = rows(data.page?.items);
        countEl.textContent = `${list.length} 条`;
        coverageEl.textContent = coverageNote(data.coverage, data.range);
        listEl.innerHTML = list.length
          ? `<div class="evidence-timeline">${list.map(recordRow).join('')}</div>`
          : '<p class="view-intro">本周还没有学习记录。完成一次学习后记录，时间线就会显示真实的用时与来源。</p>';
        listEl.querySelectorAll('[data-record]').forEach(button =>
          button.addEventListener('click', () => loadRecordDetail(button.dataset.record)));
      } catch (error) { listEl.innerHTML = offline(error); }
      await loadReviews();
      await loadSkills();
    }

    function recordRow(record) {
      const duration = record.durationMinutes == null ? '用时未记录' : `${record.durationMinutes} 分钟`;
      const source = record.source?.domain === 'learning' ? '来自学习计划' : '本模块记录';
      const pending = rows(record.pendingAssociations).length || rows(record.missingInformation).length;
      return `<button class="evidence-event" data-record="${esc(record.recordId)}" style="width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer">
        <i></i><div>
          <strong>${esc(record.title)}</strong>
          <span>${esc(kindText[record.kind] || record.kind)} · ${esc(fmt(record.occurredAt))} · ${esc(duration)} · ${esc(source)}${pending ? ' · 有待补充信息' : ''}</span>
        </div></button>`;
    }

    async function loadRecordDetail(recordId) {
      const el = document.querySelector('#record-detail');
      el.innerHTML = '正在读取记录详情…';
      try {
        const data = await api('/api/evidence/records/' + encodeURIComponent(recordId));
        const record = data.record;
        const skills = rows(record.skillRefs);
        const pending = rows(record.pendingAssociations);
        const missing = rows(record.missingInformation);
        el.innerHTML = `
          <strong>${esc(record.title)}</strong>
          <p>${esc(record.content)}</p>
          <p class="view-intro">${esc(kindText[record.kind] || record.kind)} · 版本 ${esc(record.version)} · 材料 ${rows(record.materials).length} 项（${esc(record.materialState)}）${record.contributionPending ? ' · 本人贡献待补充' : ''}</p>
          <p class="view-intro">关联能力：${skills.length ? esc(skills.map(skill => skill.name).join('、')) : '未关联'}</p>
          ${pending.length ? `<p class="view-intro">待确认关联：${esc(pending.map(item => `${item.source}（${item.reason}）`).join('；'))}</p>` : ''}
          ${missing.length ? `<p class="view-intro">需要补充：${esc(missing.join('；'))}</p>` : ''}
          <button class="secondary" id="assess-record">评估该记录支持的能力</button>
          <div class="interview-feedback" id="assess-result"></div>`;
        document.querySelector('#assess-record').addEventListener('click', () => assessRecord(recordId, skills));
      } catch (error) { el.innerHTML = offline(error); }
    }

    async function assessRecord(recordId, skills) {
      const resultEl = document.querySelector('#assess-result');
      if (!skills.length) { toastIt('这条记录还没有关联能力标识，无法评估'); return; }
      resultEl.textContent = '正在评估…';
      try {
        const data = await api('/api/evidence/assessments', {
          method: 'POST',
          body: JSON.stringify({ evidenceIds: [recordId], skillIds: skills.map(skill => skill.skillId) })
        });
        const findings = rows(data.assessment.findings);
        resultEl.innerHTML = `
          <strong>评估结果</strong><br>
          ${lines(findings, finding => `${esc(finding.skill.name)}：${esc(supportText[finding.support] || finding.support)} · 引用 ${rows(finding.citations).length} 处${rows(finding.limitations).length ? ` · 局限：${esc(finding.limitations.join('；'))}` : ''}`)}
          <br><span class="view-intro">${esc(data.assessment.criteriaSummary)}</span>`;
        await loadSkills();
      } catch (error) { resultEl.textContent = error.message; }
    }

    async function generateReview() {
      const to = new Date();
      const from = new Date(Date.now() - 7 * 86400000);
      try {
        await api('/api/evidence/reviews', {
          method: 'POST',
          body: JSON.stringify({ from: from.toISOString(), to: to.toISOString() })
        });
        await loadReviews();
        toastIt('阶段复盘已生成');
      } catch (error) { toastIt(error.message); }
    }

    async function loadReviews() {
      const el = document.querySelector('#review-list');
      const stateEl = document.querySelector('#review-state');
      try {
        const data = await api('/api/evidence/reviews');
        const summaries = rows(data.page?.items);
        if (!summaries.length) {
          stateEl.textContent = '暂无';
          el.innerHTML = '<p class="view-intro">还没有阶段复盘。选择一段时间后点击“生成阶段复盘”。</p>';
          return;
        }
        const detail = await api('/api/evidence/reviews/' + encodeURIComponent(summaries[0].reviewId));
        const review = detail.review;
        stateEl.textContent = statusText[review.status] || review.status;
        el.innerHTML = `
          <strong>${esc(fmt(review.range.from))} – ${esc(fmt(review.range.to))}</strong>
          ${review.sourceChanged ? '<p class="view-intro">生成后有记录被修改或撤回，建议重新生成复盘。</p>' : ''}
          <p><b>这段时间的进展</b><br>${lines(rows(review.progress), item => `${esc(item.text)}（引用 ${rows(item.citations).length} 处）`)}</p>
          <p><b>需要关注的卡点</b><br>${lines(rows(review.blockers), item => `${esc(item.observation)}${item.hypothesis ? `（可能原因：${esc(item.hypothesis)}）` : ''}`)}</p>
          <p><b>下一步建议</b><br>${lines(rows(review.suggestions), item => esc(item.text))}</p>
          <p class="view-intro">计划调整仍由学习计划模块决定，本模块只给出建议。</p>`;
      } catch (error) { el.innerHTML = offline(error); }
    }

    async function loadSkills() {
      const el = document.querySelector('#skill-list');
      const stateEl = document.querySelector('#skill-state');
      try {
        const data = await api('/api/evidence/skills');
        const cards = rows(data.page?.items);
        stateEl.textContent = cards.length ? `${cards.length} 项` : '暂无';
        el.innerHTML = cards.length ? cards.map(card => {
          const label = verificationText[card.verification] || card.verification;
          const latest = rows(card.assessments)[0];
          return `<div class="evidence-row">
            <div><strong>${esc(card.skill.name)}</strong>
            <span>${esc(label)} · 证据 ${rows(card.evidenceIds).length} 条${latest ? ` · 最近评估 ${esc(fmt(latest.createdAt))}` : ''}</span></div>
            <b class="evidence-state${card.verification === 'available' ? '' : ' pending'}">${esc(label)}</b>
          </div>`;
        }).join('') : '<p class="view-intro">还没有能力评估。打开一条带能力标识的记录并执行评估后，这里会显示依据与有效性。</p>';
      } catch (error) { el.innerHTML = offline(error); }
    }

    /* ------------------------------ 模拟面试 ------------------------------ */
    async function loadInterviews() {
      const root = document.querySelector('#interview-root');
      try {
        const data = await api('/api/evidence/interviews');
        const session = data.session;
        const history = rows(data.page?.items);
        root.innerHTML = (session ? sessionMarkup(session) : startMarkup()) + historyMarkup(history);
        if (session) sessionEvents(session); else startEvents();
      } catch (error) { root.innerHTML = offline(error); }
    }

    function startMarkup() {
      return `<article class="card module-body">
        <div class="card-head"><h2>开始一次模拟面试</h2><span class="badge">训练范围由你决定</span></div>
        <p class="view-intro">请填写训练类型和真实目标标识。岗位标识来自职业规划，能力标识来自共享能力目录；缺少依据时服务端会要求先补充。</p>
        <div class="search">
          <select id="interview-kind">
            <option value="skills">能力</option>
            <option value="job">目标岗位</option>
            <option value="project">项目</option>
          </select>
          <input id="interview-target" placeholder="能力标识（逗号分隔）／岗位标识／项目标识">
          <input id="interview-count" type="number" min="1" max="20" value="5" title="题量 1-20">
          <input id="interview-focus" placeholder="可选：重点（如项目细节）">
          <button class="primary" id="start-interview">开始面试</button>
        </div>
        <div class="interview-feedback" id="interview-error"></div>
      </article>`;
    }

    function startEvents() {
      document.querySelector('#start-interview').addEventListener('click', async event => {
        const button = event.currentTarget;
        const kind = document.querySelector('#interview-kind').value;
        const raw = document.querySelector('#interview-target').value.trim();
        const count = Number(document.querySelector('#interview-count').value) || 5;
        const focus = document.querySelector('#interview-focus').value.trim();
        const errorEl = document.querySelector('#interview-error');
        errorEl.textContent = '';
        if (!raw) { errorEl.textContent = '请先填写训练范围标识'; return; }
        const target = kind === 'skills'
          ? { kind, skillIds: raw.split(',').map(item => item.trim()).filter(Boolean) }
          : kind === 'job' ? { kind, jobId: raw } : { kind, projectId: raw };
        button.disabled = true;
        try {
          await api('/api/evidence/interviews', {
            method: 'POST',
            body: JSON.stringify({ target, questionCount: count, ...(focus ? { focus } : {}) })
          });
          await loadInterviews();
        } catch (error) { errorEl.textContent = error.message; button.disabled = false; }
      });
    }

    function sessionMarkup(session) {
      const question = session.currentQuestion;
      const lastFeedback = rows(session.answers).at(-1)?.feedback;
      const report = session.report;
      const failed = session.status === 'preparation_failed';
      return `<div class="interview-grid">
        <article class="card">
          <div class="card-head"><h2>模拟面试</h2><span class="badge">${esc(statusText[session.status] || session.status)}</span></div>
          <div class="interview-question">
            ${failed
              ? `<p class="view-intro">题目没有生成成功：${esc(rows(session.coverage?.missing).map(item => item.reason).join('；') || '生成服务不可用')}</p>
                 <button class="primary" id="retry-interview">${esc(session.recovery?.action || '重新生成题目')}</button>`
              : question
                ? `<div class="question-meta"><span>第 <b>${esc(question.ordinal)}</b> 题</span><span>共 <b>${esc(session.totalQuestions)}</b> 题</span></div>
                   <h2>${esc(question.prompt)}</h2>
                   <textarea class="interview-answer" id="answer-input" placeholder="输入你的回答"></textarea>
                   <div class="question-actions"><span>回答会被原样保存，并基于实际内容生成反馈。</span>
                   <button class="primary" id="submit-answer">提交回答</button></div>`
                : '<p class="view-intro">本场题目已全部作答。</p>'}
            <div class="interview-feedback" id="answer-feedback">
              ${lastFeedback
                ? `<strong>本题反馈（${esc(statusText[lastFeedback.status] || lastFeedback.status)}）</strong><br>
                   ${rows(lastFeedback.strengths).length ? `优点：${esc(lastFeedback.strengths.join('；'))}<br>` : ''}
                   ${rows(lastFeedback.issues).map(issue => `${esc(issue.text)}${issue.quote ? `（原话：“${esc(issue.quote)}”）` : ''}`).join('<br>')}
                   ${rows(lastFeedback.suggestions).length ? `<br>建议：${esc(lastFeedback.suggestions.join('；'))}` : ''}
                   ${rows(lastFeedback.limitations).length ? `<br><span class="view-intro">局限：${esc(lastFeedback.limitations.join('；'))}</span>` : ''}`
                : '提交回答后显示服务端反馈。'}
            </div>
          </div>
        </article>
        <aside class="card interview-side">
          <div class="card-head"><h2>面试进度</h2><span class="badge">${esc(rows(session.answers).length)} / ${esc(session.totalQuestions ?? '—')}</span></div>
          <div class="interview-steps">
            ${rows(session.questions).map(item => `<div class="interview-step${item.ordinal === session.answeredCount + 1 ? ' current' : ''}"><b>${esc(item.ordinal)}</b>${esc(item.category === 'knowledge' ? '知识理解' : item.category === 'project' ? '项目说明' : '表达')}${rows(session.answers).some(answer => answer.questionId === item.questionId) ? ' · 已答' : ''}</div>`).join('')}
          </div>
          ${!failed ? '<button class="secondary" id="finish-interview" style="width:100%;margin-top:18px">结束并查看反馈</button>' : ''}
          ${report
            ? `<div class="interview-feedback"><strong>整场报告</strong><br>${esc(report.summary)}
               ${rows(report.findings).length ? `<br>${rows(report.findings).map(finding => `${esc(finding.skill.name)}：${esc(supportText[finding.support] || finding.support)}`).join('；')}` : ''}
               ${rows(report.recommendations).length ? `<br>建议：${esc(report.recommendations.join('；'))}` : ''}
               ${rows(report.limitations).length ? `<br><span class="view-intro">局限：${esc(report.limitations.join('；'))}</span>` : ''}</div>`
            : `<p class="view-intro">报告状态：${esc(statusText[session.reportStatus] || session.reportStatus)}</p>`}
        </aside>
      </div>`;
    }

    function sessionEvents(session) {
      const errorEl = document.querySelector('#answer-feedback');
      document.querySelector('#submit-answer')?.addEventListener('click', async event => {
        const answer = document.querySelector('#answer-input').value.trim();
        if (!answer) { toastIt('请先输入回答'); return; }
        event.currentTarget.disabled = true;
        try {
          await api(`/api/evidence/interviews/${encodeURIComponent(session.interviewId)}/answers`, {
            method: 'POST',
            body: JSON.stringify({ questionId: session.currentQuestion.questionId, answer })
          });
          await loadInterviews();
        } catch (error) { errorEl.textContent = error.message; event.currentTarget.disabled = false; }
      });
      document.querySelector('#finish-interview')?.addEventListener('click', async event => {
        event.currentTarget.disabled = true;
        try {
          await api(`/api/evidence/interviews/${encodeURIComponent(session.interviewId)}/finish`, { method: 'POST', body: '{}' });
          await loadInterviews();
        } catch (error) { toastIt(error.message); event.currentTarget.disabled = false; }
      });
      document.querySelector('#retry-interview')?.addEventListener('click', async event => {
        event.currentTarget.disabled = true;
        try {
          await api('/api/evidence/interviews', {
            method: 'POST',
            body: JSON.stringify({ target: session.target, questionCount: session.totalQuestions || 5, startNew: true })
          });
          await loadInterviews();
        } catch (error) { toastIt(error.message); event.currentTarget.disabled = false; }
      });
    }

    function historyMarkup(history) {
      if (!history.length) return '';
      return `<article class="card" style="margin-top:18px">
        <div class="card-head"><h2>历史面试</h2><span class="badge">${history.length} 场</span></div>
        <div class="module-body evidence-list">
          ${history.map(item => `<div class="evidence-row">
            <div><strong>${esc(item.target.kind === 'job' ? `岗位 ${item.target.jobId}` : item.target.kind === 'skills' ? `能力 ${rows(item.target.skillIds).join('、')}` : `项目 ${item.target.projectId}`)}</strong>
            <span>${esc(statusText[item.status] || item.status)} · 已答 ${esc(item.answeredCount)} / ${esc(item.totalQuestions ?? '—')} · ${esc(fmt(item.createdAt))} · 报告：${esc(statusText[item.reportStatus] || item.reportStatus)}</span></div>
            ${item.summary ? `<b class="evidence-state">${esc(item.summary)}</b>` : ''}
          </div>`).join('')}
        </div>
      </article>`;
    }
  })();
</script></body>
</html>
