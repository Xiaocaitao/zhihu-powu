<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知乎 · 看山助手（视觉原型）</title>
  <style>
    :root {
      --blue: #056de8;
      --blue-2: #2d8cff;
      --ink: #182333;
      --muted: #7e8b9f;
      --line: #e7edf5;
      --sidebar: #f7faff;
      --canvas: #ffffff;
      --bubble: #f3f7fc;
      --shadow: 0 18px 50px rgba(35, 78, 132, .09);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 980px; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); background: var(--canvas); }
    button, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    .app { display: grid; grid-template-columns: 276px 1fr; height: 100vh; }
    .sidebar { position: relative; display: flex; flex-direction: column; gap: 20px; padding: 22px 14px 16px; background: var(--sidebar); border-right: 1px solid var(--line); }
    .brand-row { display: flex; align-items: center; justify-content: space-between; padding: 0 9px 2px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: -.02em; }
    .logo { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; color: #fff; background: linear-gradient(145deg, #1694ff, #056de8); font-size: 17px; font-weight: 800; box-shadow: 0 6px 14px rgba(5,109,232,.22); }
    .brand small { display: block; margin-top: 2px; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
    .icon-btn { width: 32px; height: 32px; border-radius: 9px; color: #7890ad; background: transparent; font-size: 18px; }
    .icon-btn:hover { color: var(--blue); background: #eaf3ff; }
    .new-chat { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border-radius: 11px; color: #fff; background: var(--blue); font-size: 14px; font-weight: 650; box-shadow: 0 8px 17px rgba(5,109,232,.2); transition: .18s ease; }
    .new-chat:hover { transform: translateY(-1px); background: #005cc8; }
    .new-chat span:first-child { font-size: 21px; font-weight: 300; line-height: 15px; }
    .section-title { padding: 0 12px; color: #9aa8ba; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .chat-list { display: flex; flex-direction: column; gap: 3px; margin-top: -11px; overflow: auto; }
    .chat { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 11px; border-radius: 10px; color: #45556b; background: transparent; text-align: left; font-size: 13px; }
    .chat:hover { background: #edf4fc; }
    .chat.active { color: var(--ink); background: #e8f2ff; font-weight: 650; }
    .chat .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: #bad0e9; }
    .chat.active .dot { background: var(--blue); box-shadow: 0 0 0 4px rgba(5,109,232,.1); }
    .chat .label { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .chat time { color: #a6b2c1; font-size: 10px; }
    .sidebar-spacer { flex: 1; }
    .profile { display: flex; align-items: center; gap: 10px; padding: 10px 9px 3px; border-top: 1px solid var(--line); }
    .avatar { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: #fff; background: #25496e; font-size: 12px; font-weight: 700; }
    .profile strong { display: block; font-size: 12px; }
    .profile span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .main { position: relative; display: flex; flex-direction: column; min-width: 0; background: radial-gradient(circle at 85% 8%, #f5faff 0, transparent 34%), #fff; }
    .topbar { display: flex; align-items: center; justify-content: space-between; height: 62px; padding: 0 34px; border-bottom: 1px solid rgba(231,237,245,.8); }
    .crumb { display: flex; align-items: center; gap: 9px; font-size: 13px; color: #9aa8ba; }
    .crumb strong { color: var(--ink); font-size: 14px; }
    .crumb .badge { padding: 4px 8px; border-radius: 99px; color: #2673cf; background: #eaf3ff; font-size: 11px; font-weight: 650; }
    .content { width: min(900px, calc(100% - 80px)); flex: 1; margin: 0 auto; padding: 50px 0 170px; overflow: auto; }
    .welcome { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 40px; }
    .welcome-mark { width: 42px; height: 42px; object-fit: contain; margin-top: 2px; }
    .eyebrow { margin: 0 0 8px; color: var(--blue); font-size: 11px; font-weight: 750; letter-spacing: .12em; }
    h1 { margin: 0; font-size: clamp(27px, 3vw, 38px); letter-spacing: -.045em; line-height: 1.18; }
    .intro { max-width: 630px; margin: 13px 0 0; color: #75849a; font-size: 14px; line-height: 1.8; }
    .message { display: flex; gap: 15px; margin: 24px 0; }
    .message.user { justify-content: flex-end; }
    .message.user .bubble { order: 1; color: #fff; background: var(--blue); border-radius: 18px 18px 4px 18px; }
    .message.user .mini-avatar { order: 2; background: #daeaff; color: var(--blue); }
    .mini-avatar { display: grid; place-items: center; flex: none; width: 30px; height: 30px; margin-top: 2px; border-radius: 10px; color: #fff; background: #dff0ff; overflow: hidden; font-size: 12px; font-weight: 700; }
    .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .bubble { max-width: 690px; padding: 15px 18px; border: 1px solid #eef2f7; border-radius: 4px 18px 18px 18px; background: #fff; box-shadow: 0 8px 22px rgba(36,77,125,.045); color: #3b4a5e; font-size: 14px; line-height: 1.75; }
    .bubble p { margin: 0 0 10px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble strong { color: var(--ink); }
    .checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; margin-top: 13px; padding-top: 13px; border-top: 1px solid #edf2f7; color: #667991; font-size: 13px; }
    .checklist span::before { content: '✓'; display: inline-grid; place-items: center; width: 17px; height: 17px; margin-right: 6px; border-radius: 50%; color: var(--blue); background: #e8f3ff; font-size: 11px; }
    .execution-log { margin-top: 14px; padding: 12px 14px; border: 1px solid #e6eef8; border-radius: 12px; background: #f8fbff; color: #667991; font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .execution-log-title { margin-bottom: 5px; color: #50709a; font-family: inherit; font-weight: 700; }
    .execution-log-line { display: flex; gap: 8px; align-items: baseline; }
    .execution-log-line::before { content: '›'; color: var(--blue); font-weight: 800; }
    .execution-log-line.done::before { content: '✓'; color: #26a269; }
    .execution-log-line.error { color: #b45151; }
    .composer-wrap { position: absolute; right: 0; bottom: 0; left: 0; padding: 22px 34px 28px; background: linear-gradient(transparent, #fff 24%); }
    .composer { display: flex; align-items: flex-end; gap: 10px; width: min(900px, 100%); margin: 0 auto; padding: 12px 13px 12px 17px; border: 1px solid #dce8f5; border-radius: 18px; background: rgba(255,255,255,.96); box-shadow: var(--shadow); }
    textarea { flex: 1; min-height: 24px; max-height: 100px; padding: 4px 0; border: 0; outline: 0; resize: none; color: var(--ink); background: transparent; font-size: 14px; line-height: 1.6; }
    textarea::placeholder { color: #a3b0c0; }
    .compose-tools { display: flex; align-items: center; gap: 3px; }
    .tool { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 9px; color: #8292a8; background: transparent; font-size: 17px; }
    .tool:hover { color: var(--blue); background: #edf5ff; }
    .send { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; color: #fff; background: var(--blue); font-size: 17px; transition: .18s ease; }
    .send:hover { transform: translateY(-1px); background: #005cc8; }
    .hint { margin-top: 9px; color: #aab6c4; font-size: 10px; text-align: center; }
    .markdown p { margin: 0 0 10px; }
    .markdown p:last-child { margin-bottom: 0; }
    .markdown ul, .markdown ol { margin: 6px 0; padding-left: 22px; }
    .markdown code { padding: 2px 5px; border-radius: 5px; background: #edf3f9; font: .9em ui-monospace, SFMono-Regular, Menlo, monospace; }
    .markdown pre { overflow: auto; padding: 12px; border-radius: 9px; color: #eaf3ff; background: #182333; }
    .markdown pre code { padding: 0; background: transparent; }
    .markdown a { color: var(--blue); }
    .mascot { position: absolute; right: 26px; bottom: 120px; width: 70px; height: 70px; object-fit: contain; opacity: .95; pointer-events: none; filter: drop-shadow(0 10px 12px rgba(54,98,146,.12)); }
    .toast { position: fixed; right: 25px; top: 76px; padding: 10px 14px; border: 1px solid #dcecff; border-radius: 10px; color: #2866ac; background: #f6fbff; box-shadow: 0 10px 25px rgba(42,91,145,.12); font-size: 12px; opacity: 0; transform: translateY(-8px); transition: .2s ease; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 1100px) { .app { grid-template-columns: 245px 1fr; } .content { width: min(780px, calc(100% - 56px)); } .composer-wrap { padding-right: 25px; padding-left: 25px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand"><div class="logo">知</div><div>看山助手<small>Zhihu AI Workspace</small></div></div>
      </div>
      <div class="sidebar-spacer"></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="crumb"><strong>后端开发学习路线</strong><span>·</span><span>看山助手</span><span class="badge">Beta</span></div></header>
      <section class="content" id="content">
        <div class="welcome"><img class="welcome-mark" src="assets/kanshan-front.jpg" alt="看山"/><div><p class="eyebrow">HELLO, 看山</p><h1>把一个模糊目标，<br/>变成一条可执行的路。</h1><p class="intro">告诉我你想去哪里、现在在哪里，以及每周有多少时间。我会和你一起拆解问题，给出清晰、可落地的下一步。</p></div></div>
      </section>
      <img class="mascot" src="assets/wander.gif" alt="刘看山"/>
      <div class="composer-wrap"><div class="composer"><button class="tool" title="添加附件">＋</button><textarea id="input" rows="1" placeholder="输入消息，开始和看山对话…"></textarea><div class="compose-tools"><button class="tool" title="语音输入">♩</button><button class="send" id="send" title="发送">↑</button></div></div><div class="hint">看山可能会犯错，请核对重要信息 · 内容仅供学习交流</div></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/assets/marked.umd.js"></script>
  <script>
    const toast = document.querySelector('#toast');
    function showToast(text) { toast.textContent = text; toast.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => toast.classList.remove('show'), 1800); }
    function markdown(value) {
      const escaped = String(value ?? '').replace(/[&<>\"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', "'": '&#39;' }[character]));
      return marked.parse(escaped, { breaks: true, gfm: true });
    }
    document.querySelector('#send').addEventListener('click', submitRoute);
    document.querySelector('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.querySelector('#send').click(); } });

    async function submitRoute() {
      const input = document.querySelector('#input');
      const send = document.querySelector('#send');
      if (send.disabled) return;
      const goal = input.value.trim();
      if (!goal) { showToast('先写点什么吧'); input.focus(); return; }
      if (goal.length > 1000) { showToast('请将目标描述控制在 1000 字以内'); return; }
      appendMessage('user', goal);
      input.value = '';
      send.disabled = true;
      const log = appendProgressMessage();
      const streamBubble = appendMessage('assistant', '');
      streamBubble.classList.add('markdown', 'streaming');
      appendLogLine(log, '正在提交请求');
      try {
        const response = await fetch('/api/routes', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ goal, profile: { weekly_hours: 10 } }),
        });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          const details = error.issues?.map(issue => `${issue.path.join('.')}: ${issue.message}`).join('；');
          throw new Error(details || error.error || '请求失败，请稍后重试');
        }
        const record = await readRouteStream(response, log, delta => {
          streamBubble.dataset.raw = (streamBubble.dataset.raw || '') + delta;
          streamBubble.innerHTML = markdown(streamBubble.dataset.raw);
        });
        streamBubble.parentElement.remove();
        appendRouteMessage(record);
      } catch (error) {
        appendLogLine(log, error instanceof Error ? error.message : '生成失败', true);
        showToast('生成失败');
      } finally {
        send.disabled = false;
      }
    }

    function appendMessage(role, content) {
      const message = document.createElement('div');
      message.className = `message ${role}`;
      const avatar = document.createElement('div');
      avatar.className = 'mini-avatar';
      avatar.textContent = role === 'user' ? '我' : '山';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = content;
      message.append(avatar, bubble);
      document.querySelector('#content').append(message);
      message.scrollIntoView({ behavior: 'smooth', block: 'end' });
      return bubble;
    }

    function appendProgressMessage() {
      const message = document.createElement('div');
      message.className = 'message';
      const avatar = document.createElement('div');
      avatar.className = 'mini-avatar';
      avatar.textContent = '山';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<strong>正在为你生成路线</strong>';
      const log = document.createElement('div');
      log.className = 'execution-log';
      log.setAttribute('role', 'log');
      log.setAttribute('aria-live', 'polite');
      log.innerHTML = '<div class="execution-log-title">执行日志</div>';
      bubble.append(log);
      message.append(avatar, bubble);
      document.querySelector('#content').append(message);
      message.scrollIntoView({ behavior: 'smooth', block: 'end' });
      return log;
    }

    function appendLogLine(log, message, error = false) {
      const line = document.createElement('div');
      line.className = `execution-log-line${error ? ' error' : ''}`;
      line.textContent = `${new Date().toLocaleTimeString('zh-CN', { hour12: false })} ${message}`;
      log.append(line);
      log.parentElement.parentElement.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    async function readRouteStream(response, log, onDelta) {
      if (!response.body) throw new Error('浏览器不支持 SSE 流式响应');
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let record;
      try {
      while (true) {
        const { value, done } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        const blocks = buffer.split(/\r?\n\r?\n/);
        buffer = blocks.pop() || '';
        for (const block of blocks) {
          const event = parseSseBlock(block);
          if (!event) continue;
          if (event.name === 'progress') appendLogLine(log, event.data.message || '处理中');
          if (event.name === 'delta') onDelta?.(event.data.delta || '');
          if (event.name === 'complete') { record = event.data; appendLogLine(log, '完成，路线已保存', false); log.lastElementChild.classList.add('done'); }
          if (event.name === 'error') throw new Error(event.data.error || '路线生成失败');
        }
        if (done) break;
      }
      if (buffer.trim()) {
        const event = parseSseBlock(buffer);
        if (event?.name === 'delta') onDelta?.(event.data.delta || '');
        if (event?.name === 'complete') record = event.data;
        if (event?.name === 'error') throw new Error(event.data.error || '路线生成失败');
      }
      if (!record) throw new Error('服务未返回完整路线');
      return record;
      } finally {
        await reader.cancel().catch(() => {});
        reader.releaseLock();
      }
    }

    function parseSseBlock(block) {
      const lines = block.split(/\r?\n/);
      const name = lines.find(line => line.startsWith('event: '))?.slice(7) || 'message';
      const raw = lines.filter(line => line.startsWith('data: ')).map(line => line.slice(6)).join('\n');
      return raw ? { name, data: JSON.parse(raw) } : null;
    }

    function appendRouteMessage(record) {
      const plan = record.plan || {};
      const bubble = appendMessage('assistant', '路线已经生成好了。');
      const summary = document.createElement('div');
      summary.className = 'markdown';
      summary.innerHTML = markdown(plan.summary || '已完成路线规划。');
      bubble.append(summary);
      const checklist = document.createElement('div');
      checklist.className = 'checklist';
      for (const item of (plan.two_week_plan || [])) {
        const step = document.createElement('span');
        step.className = 'markdown';
        step.innerHTML = markdown(`第 ${item.day} 天：${item.title}（${item.hours} 小时）\n${(item.actions || []).join('；')}\n完成标准：${item.acceptance}`);
        checklist.append(step);
      }
      bubble.append(checklist);
      const sources = document.createElement('p');
      for (const source of plan.sources || []) {
        const link = document.createElement('a');
        try {
          const url = new URL(source.url);
          if (!['http:', 'https:'].includes(url.protocol)) continue;
          link.href = url.href;
        } catch { continue; }
        link.target = '_blank';
        link.rel = 'noreferrer';
        link.textContent = source.title;
        sources.append(link, document.createElement('br'));
      }
      bubble.append(sources);
    }
  </script>
</body>
</html>
