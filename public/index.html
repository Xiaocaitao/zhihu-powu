<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>看山助手</title><script src="/assets/marked.umd.js"></script><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b4d;background:#fff}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}aside{background:#f6f8fc;border-right:1px solid #e4ebf5;padding:28px 18px}aside h1{margin:0 0 42px;color:#087df0;font-size:22px}aside p{color:#8294ae;line-height:1.8}main{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.top{padding:22px 42px;border-bottom:1px solid #edf1f6;font-weight:600}.messages{min-height:0;overflow-y:auto;padding:44px max(24px,calc((100% - 900px)/2)) 150px}.msg{max-width:820px;margin:0 auto 24px;line-height:1.75;font-size:16px;word-break:break-word}.user{margin-left:auto;background:#087df0;color:#fff;border-radius:18px 18px 4px 18px;padding:12px 18px;max-width:70%}.assistant{background:#f7f9fc;border:1px solid #e8eef7;border-radius:18px;padding:18px 22px}.thinking{color:#8192aa;background:#fbfcfe;font-size:13px;white-space:pre-wrap}.tool{color:#587ba7;background:#eef5ff;font-size:13px;white-space:pre-wrap}.markdown :where(p:first-child){margin-top:0}.markdown pre{background:#1e293b;color:#e2e8f0;padding:14px;border-radius:10px;overflow:auto}.markdown code{background:#e9eef6;padding:2px 5px;border-radius:4px}.composer{padding:18px max(24px,calc((100% - 900px)/2));border-top:1px solid #edf1f6;background:#fff}.composer form{display:flex;gap:12px}.composer textarea{flex:1;border:1px solid #d8e3f2;border-radius:14px;padding:14px;resize:none;font:inherit}.composer button{border:0;border-radius:12px;background:#087df0;color:#fff;padding:0 24px;font-size:16px}.error{color:#c43d4b}
</style></head><body><div class="app"><aside><h1>知｜看山助手</h1><p>把问题交给 Agent<br>模型会自主理解、调用工具并回答。</p></aside><main><div class="top">看山助手 · Beta</div><section id="messages" class="messages"></section><div class="composer"><form id="form"><textarea id="input" rows="2" placeholder="输入消息，开始和看山对话…"></textarea><button>发送</button></form></div></main></div><script>
const messages=document.querySelector('#messages'),form=document.querySelector('#form'),input=document.querySelector('#input');let sessionId;const id=()=>crypto.randomUUID();
function add(role,text='',kind=''){const el=document.createElement('article');el.className=`msg ${role} ${kind}`;el.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight;return el}
function render(el,raw){const html=window.marked?.parse(raw,{breaks:true})??raw;const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,style,iframe,object,embed').forEach(n=>n.remove());doc.querySelectorAll('*').forEach(n=>{[...n.attributes].forEach(a=>{if(a.name.startsWith('on')||((a.name==='href'||a.name==='src')&&!/^(https?:|mailto:|#|\/)/i.test(a.value)))n.removeAttribute(a.name)})});el.replaceChildren(...doc.body.childNodes);}
function parseSse(response,handlers){const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';return (async()=>{for(;;){const {value,done}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});let i;while((i=buffer.search(/\r?\n\r?\n/))>=0){const block=buffer.slice(0,i);buffer=buffer.slice(i+(/\r?\n\r?\n/.exec(buffer)?.[0].length||2));const event=block.match(/^event: (.+)$/m)?.[1]||'message',line=block.match(/^data: (.+)$/m)?.[1];if(line)handlers[event]?.(JSON.parse(line))}if(done){if(buffer.trim())handlers.message?.(JSON.parse(buffer.slice(6)));break}}})()}
form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;input.value='';add('user',message);const answer=add('assistant','');const thinking=add('assistant','正在思考…','thinking');let raw='';try{const response=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message,request_id:id(),...(sessionId?{session_id:sessionId}:{})})});if(!response.ok)throw new Error((await response.json()).error||`HTTP ${response.status}`);await parseSse(response,{session:e=>{sessionId=e.session_id},thinking_delta:e=>{thinking.textContent+=e.delta;messages.scrollTop=messages.scrollHeight},tool_start:e=>{thinking.textContent+=`\n调用 ${e.tool_name}`},tool_update:e=>{},tool_end:e=>{},text_delta:e=>{raw+=e.delta;render(answer,raw);thinking.remove();messages.scrollTop=messages.scrollHeight},complete:()=>{thinking.remove();if(!raw)render(answer,'')},error:e=>{thinking.classList.add('error');thinking.textContent=e.error}})}catch(error){thinking.classList.add('error');thinking.textContent=error.message}});
</script></body></html>
