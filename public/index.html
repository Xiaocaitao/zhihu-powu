<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>看山助手</title>
  <script src="/assets/marked.umd.js"></script>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b4d;background:#fff}
    *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}
    .app{height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}
    aside{background:#f6f8fc;border-right:1px solid #e4ebf5;padding:28px 18px;display:flex;flex-direction:column;min-height:0}
    aside h1{margin:0 0 26px;color:#087df0;font-size:22px}
    aside p{color:#8294ae;line-height:1.8;margin:0 0 20px}
    .new-session{width:100%;border:1px solid #b8d7fb;border-radius:10px;background:#fff;color:#087df0;padding:10px 12px;font:inherit;cursor:pointer}
    .new-session:hover{background:#eef6ff}.session-list{margin:18px -6px 0;overflow:auto;min-height:0}
    .session-item{display:block;width:100%;border:0;border-radius:9px;background:transparent;color:#526987;text-align:left;padding:10px 12px;margin-bottom:4px;cursor:pointer;font:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .session-item:hover{background:#eaf3ff}.session-item.active{background:#dcecff;color:#075fbe;font-weight:600}.empty-sessions{padding:8px 12px;color:#9aaac0;font-size:13px}
    main{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
    .top{padding:16px 42px;border-bottom:1px solid #edf1f6;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .zhihu-account{position:relative;font-weight:400}.zhihu-login,.zhihu-profile-button{border:1px solid #b8d7fb;border-radius:999px;background:#fff;color:#087df0;padding:8px 14px;font:inherit;text-decoration:none;cursor:pointer}.zhihu-profile-button{display:flex;align-items:center;gap:8px}.zhihu-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#dcecff}.zhihu-profile-panel{position:absolute;z-index:3;right:0;top:calc(100% + 10px);width:260px;padding:16px;border:1px solid #e2eaf4;border-radius:14px;background:#fff;box-shadow:0 12px 30px #172b4d20;font-size:13px;font-weight:400}.zhihu-profile-panel p{margin:6px 0;color:#526987;word-break:break-word}.zhihu-profile-panel strong{color:#172b4d}.zhihu-profile-panel a{color:#087df0}.zhihu-logout{margin-top:10px;border:0;background:none;color:#c43d4b;cursor:pointer;padding:0;font:inherit}
    .messages{min-height:0;overflow-y:auto;padding:44px max(24px,calc((100% - 900px)/2)) 150px}
    .msg{max-width:820px;margin:0 auto 24px;line-height:1.75;font-size:16px;word-break:break-word}
    .user{margin-left:auto;background:#087df0;color:#fff;border-radius:18px 18px 4px 18px;padding:12px 18px;max-width:70%}
    .assistant{background:#f7f9fc;border:1px solid #e8eef7;border-radius:18px;padding:18px 22px}
    .thinking{color:#8192aa;background:#fbfcfe;font-size:13px;white-space:pre-wrap}.markdown :where(p:first-child){margin-top:0}
    .markdown pre{background:#1e293b;color:#e2e8f0;padding:14px;border-radius:10px;overflow:auto}.markdown code{background:#e9eef6;padding:2px 5px;border-radius:4px}
    .composer{padding:18px max(24px,calc((100% - 900px)/2));border-top:1px solid #edf1f6;background:#fff}.composer form{display:flex;gap:12px}
    .composer textarea{flex:1;border:1px solid #d8e3f2;border-radius:14px;padding:14px;resize:none;font:inherit}.composer button{border:0;border-radius:12px;background:#087df0;color:#fff;padding:0 24px;font-size:16px}.composer button:disabled{opacity:.55;cursor:wait}
    .error{color:#c43d4b}
    @media(max-width:700px){.app{grid-template-columns:1fr}aside{display:none}.top{padding:18px 24px}}
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>知｜看山助手</h1>
      <p>把问题交给 Agent<br>模型会自主理解、调用工具并回答。</p>
      <button id="new-session" class="new-session" type="button">＋ 新建会话</button>
      <div id="session-list" class="session-list"></div>
    </aside>
    <main>
      <div class="top"><span>看山助手 · Beta</span><div id="zhihu-account" class="zhihu-account"></div></div>
      <section id="messages" class="messages"></section>
      <div class="composer"><form id="form"><textarea id="input" rows="2" placeholder="输入消息，开始和看山对话…"></textarea><button id="send" type="submit">发送</button></form></div>
    </main>
  </div>
  <script>
    const messages=document.querySelector('#messages'),form=document.querySelector('#form'),input=document.querySelector('#input'),send=document.querySelector('#send'),newSession=document.querySelector('#new-session'),sessionList=document.querySelector('#session-list'),zhihuAccount=document.querySelector('#zhihu-account');
    let sessionId,activeRequest=null,requestSerial=0;
    function id(){if(globalThis.crypto?.randomUUID)return globalThis.crypto.randomUUID();const bytes=new Uint8Array(16);if(globalThis.crypto?.getRandomValues)globalThis.crypto.getRandomValues(bytes);else for(let i=0;i<bytes.length;i++)bytes[i]=Math.random()*256;bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;return [...bytes].map((b,i)=>[4,6,8,10].includes(i)?'-'+b.toString(16).padStart(2,'0'):b.toString(16).padStart(2,'0')).join('').replace(/^-/,'').replace(/^(.{8})(.{4})(.{4})(.{4})(.{12})$/,'$1-$2-$3-$4-$5')}
    function add(role,text='',kind=''){const el=document.createElement('article');el.className=`msg ${role} ${kind}`;el.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight;return el}
    function render(el,raw){el.classList.add('markdown');const html=window.marked?.parse(raw,{breaks:true})??raw;const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,style,iframe,object,embed').forEach(n=>n.remove());doc.querySelectorAll('*').forEach(n=>{[...n.attributes].forEach(a=>{if(a.name.startsWith('on')||((a.name==='href'||a.name==='src')&&!/^(https?:|mailto:|#|\/)/i.test(a.value)))n.removeAttribute(a.name)})});el.replaceChildren(...doc.body.childNodes)}
    function parseSse(response,handlers){const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';return(async()=>{for(;;){const {value,done}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});let match;while((match=buffer.match(/^(.*?)(\r?\n\r?\n)/s))){const block=match[1];buffer=buffer.slice(match[0].length);const event=block.match(/^event: (.+)$/m)?.[1]||'message',line=block.match(/^data: (.+)$/m)?.[1];if(line)handlers[event]?.(JSON.parse(line))}if(done){if(buffer.trim()){const line=buffer.match(/^data: (.+)$/m)?.[1];if(line)handlers.message?.(JSON.parse(line))}break}}})()}
    function stopActive(){requestSerial++;activeRequest?.abort();activeRequest=null;send.disabled=false}
    function safeLink(value){try{const url=new URL(value);return ['https:','http:'].includes(url.protocol)?url.href:null}catch{return null}}
    function renderZhihuAccount(data){zhihuAccount.replaceChildren();if(!data.authorized){const link=document.createElement('a');link.className='zhihu-login';link.href='/auth/zhihu/start';link.textContent='登录知乎';zhihuAccount.append(link);return}const profile=data.profile||{};const button=document.createElement('button');button.type='button';button.className='zhihu-profile-button';const avatar=document.createElement('img');avatar.className='zhihu-avatar';avatar.alt='知乎头像';avatar.src=safeLink(profile.avatar_path)||'';if(!avatar.src)avatar.style.display='none';button.append(avatar,document.createTextNode(profile.fullname||'知乎用户'));const panel=document.createElement('div');panel.className='zhihu-profile-panel';panel.hidden=true;const title=document.createElement('strong');title.textContent=profile.fullname||'知乎用户';panel.append(title);const uid=document.createElement('p');uid.textContent=`用户标识 uid：${profile.uid||'未知'}`;panel.append(uid);if(profile.headline){const headline=document.createElement('p');headline.textContent=profile.headline;panel.append(headline)}const homepage=safeLink(profile.url);if(homepage){const link=document.createElement('a');link.href=homepage;link.target='_blank';link.rel='noreferrer';link.textContent='打开知乎主页';panel.append(link)}const logout=document.createElement('button');logout.type='button';logout.className='zhihu-logout';logout.textContent='退出登录';logout.addEventListener('click',async()=>{await fetch('/api/auth/zhihu/logout',{method:'POST'});panel.hidden=true;renderZhihuAccount({authorized:false})});panel.append(document.createElement('br'),logout);button.addEventListener('click',()=>{panel.hidden=!panel.hidden});zhihuAccount.append(button,panel)}
    async function loadZhihuAuth(){try{const response=await fetch('/api/auth/zhihu/status');const data=await response.json();renderZhihuAccount(data)}catch{renderZhihuAccount({authorized:false})}}
    function sessionLabel(session){return session.preview?.trim().slice(0,34)||`新会话 · ${new Date(session.created_at).toLocaleString()}`}
    function renderSessionList(sessions){sessionList.replaceChildren();if(!sessions.length){const empty=document.createElement('div');empty.className='empty-sessions';empty.textContent='还没有会话';sessionList.append(empty);return}for(const session of sessions){const button=document.createElement('button');button.type='button';button.className=`session-item${session.session_id===sessionId?' active':''}`;button.textContent=sessionLabel(session);button.title=session.preview||button.textContent;button.addEventListener('click',()=>selectSession(session.session_id));sessionList.append(button)}}
    async function refreshSessions(){const response=await fetch('/api/sessions');if(!response.ok)throw new Error(`会话列表加载失败（HTTP ${response.status}）`);const data=await response.json();renderSessionList(data.sessions||[]);return data.sessions||[]}
    async function createSession(){const response=await fetch('/api/sessions',{method:'POST'});if(!response.ok)throw new Error(`新建会话失败（HTTP ${response.status}）`);return response.json()}
    async function selectSession(nextId){stopActive();const serial=requestSerial;sessionId=nextId;messages.replaceChildren();try{const response=await fetch(`/api/sessions/${nextId}`);if(!response.ok)throw new Error(`会话加载失败（HTTP ${response.status}）`);const data=await response.json();if(serial!==requestSerial)return;for(const run of data){add('user',run.message);let raw='';for(const event of run.events||[])if(event.type==='text_delta')raw+=event.delta;if(raw){const answer=add('assistant');render(answer,raw)}}await refreshSessions()}catch(error){if(serial===requestSerial)add('assistant',error.message,'error')}}
    newSession.addEventListener('click',async()=>{stopActive();try{const created=await createSession();sessionId=created.session_id;messages.replaceChildren();await refreshSessions()}catch(error){add('assistant',error.message,'error')}});
    form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message||activeRequest)return;input.value='';if(!sessionId){try{const created=await createSession();sessionId=created.session_id;await refreshSessions()}catch(error){add('assistant',error.message,'error');return}}const serial=++requestSerial,controller=new AbortController();activeRequest=controller;send.disabled=true;add('user',message);const answer=add('assistant',''),thinking=add('assistant','正在思考…','thinking');let raw='';try{const response=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message,request_id:id(),session_id:sessionId}),signal:controller.signal});if(!response.ok)throw new Error((await response.json()).error||`HTTP ${response.status}`);await parseSse(response,{session:e=>{if(serial===requestSerial)sessionId=e.session_id},thinking_delta:e=>{if(serial!==requestSerial)return;thinking.textContent+=e.delta;messages.scrollTop=messages.scrollHeight},tool_start:e=>{if(serial===requestSerial)thinking.textContent+=`\n调用 ${e.tool_name}`},text_delta:e=>{if(serial!==requestSerial)return;raw+=e.delta;render(answer,raw);thinking.remove();messages.scrollTop=messages.scrollHeight},complete:()=>{if(serial!==requestSerial)return;thinking.remove();if(!raw)render(answer,'')}});if(serial===requestSerial)await refreshSessions()}catch(error){if(error.name!=='AbortError'&&serial===requestSerial){thinking.classList.add('error');thinking.textContent=error.message}}finally{if(serial===requestSerial){activeRequest=null;send.disabled=false}}});
    void (async()=>{await loadZhihuAuth();try{const sessions=await refreshSessions();if(sessions[0])await selectSession(sessions[0].session_id)}catch(error){add('assistant',error.message,'error')}})();
  </script>
</body>
</html>
