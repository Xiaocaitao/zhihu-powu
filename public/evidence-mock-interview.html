<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模拟面试 · 成长空间</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#172b4d;background:#f6f8fc;--b:#087df0;--m:#8294ae;--l:#e4ebf5}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:grid;grid-template-columns:236px 1fr}aside{background:#fff;border-right:1px solid var(--l);padding:26px 16px}.brand{font-weight:750;font-size:18px;margin:0 10px 34px}.logo{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#2d8cff,var(--b));color:#fff;margin-right:8px}.nav{display:grid;gap:5px}.nav button{border:0;border-radius:10px;background:transparent;color:#62758f;text-align:left;padding:11px 13px;font:inherit}.nav button.active{color:var(--b);background:#edf5ff;font-weight:650}.nav span{display:inline-block;width:25px}.label{margin:27px 10px 8px;color:#a0adbc;font-size:11px;font-weight:700}main{min-width:0}.top{height:70px;padding:0 42px;border-bottom:1px solid var(--l);background:#fff;display:flex;align-items:center;justify-content:space-between}.crumb{color:var(--m)}.crumb strong{color:#172b4d}.account{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#dcecff;color:var(--b)}.content{max-width:1160px;margin:auto;padding:38px 42px}.eyebrow{margin:0 0 8px;color:var(--b);font-size:11px;font-weight:750;letter-spacing:.12em}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.heading h1{margin:0 0 8px;font-size:29px}.heading p{margin:0;color:var(--m)}.button{border:1px solid #b8d7fb;border-radius:10px;background:#fff;color:var(--b);padding:11px 17px;font:inherit}.layout{display:grid;grid-template-columns:1fr 285px;gap:18px}.card{background:#fff;border:1px solid var(--l);border-radius:15px;box-shadow:0 5px 18px #172b4d08}.card-head{display:flex;justify-content:space-between;align-items:center;padding:19px 22px;border-bottom:1px solid #edf1f6}.card-head h2{margin:0;font-size:16px}.badge{border-radius:999px;background:#edf5ff;color:var(--b);padding:5px 9px;font-size:11px}.question{padding:24px}.meta{display:flex;justify-content:space-between;color:var(--m);font-size:12px}.question h2{font-size:20px;line-height:1.5;margin:20px 0}.answer{width:100%;min-height:190px;padding:14px;border:1px solid #d8e3f2;border-radius:11px;resize:vertical;font:inherit;color:#172b4d}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.hint{color:var(--m);font-size:12px}.primary{border:0;border-radius:10px;background:var(--b);color:#fff;padding:11px 17px;font:inherit}.feedback{margin-top:18px;padding:16px 18px;border:1px solid #dcecff;background:#f7fbff;border-radius:11px;color:#526987;line-height:1.75}.feedback strong{color:#172b4d}.side{padding:18px}.steps{display:grid;gap:7px}.step{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:9px;color:var(--m);font-size:13px}.step.current{background:#edf5ff;color:var(--b);font-weight:650}.num{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:#eef2f7;font-size:11px}.current .num{background:#cfe5ff;color:var(--b)}@media(max-width:800px){.app{grid-template-columns:1fr}aside{display:none}.top{padding:0 22px}.content{padding:28px 20px}.heading{display:block}.actions{margin-top:18px}.layout{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside><div class="brand"><span class="logo">雾</span>破雾成长</div><nav class="nav"><button><span>⌂</span>首页</button><button><span>✓</span>学习计划</button><button><span>◷</span>学习记录</button><button class="active"><span>◉</span>模拟面试</button><button><span>▣</span>知识库</button></nav><div class="label">INTERVIEW</div><div style="padding:0 13px;color:var(--m);font-size:12px;line-height:1.7">围绕训练范围逐题回答，留下可复查的反馈。</div></aside><main><header class="top"><div class="crumb"><strong>成长空间</strong>　/　模拟面试</div><div class="account">?</div></header><div class="content"><div class="heading"><div><p class="eyebrow">AI MOCK INTERVIEW</p><h1>先练习，再走进真实面试。</h1><p>面试目标、题目和反馈均为占位展示。</p></div><button class="button">历史面试</button></div><div class="layout"><article class="card"><div class="card-head"><h2>模拟面试</h2><span class="badge">训练范围占位</span></div><div class="question"><div class="meta"><span>第 <b>题号占位</b> 题</span><span>共 <b>题量占位</b> 题</span></div><h2>面试题目占位：请介绍一个你完成的项目，以及其中解决的具体问题。</h2><textarea class="answer" placeholder="输入你的回答"></textarea><div class="actions"><span class="hint">回答会被保存，并基于实际内容生成反馈。</span><button class="primary">提交回答</button></div><div class="feedback"><strong>本题反馈占位</strong><br>知识理解、项目说明和表达建议将在回答提交后显示。</div></div></article><aside class="card side"><div class="card-head" style="padding:0 0 15px;border:0"><h2>面试进度</h2><span class="badge">状态占位</span></div><div class="steps"><div class="step current"><span class="num">1</span>当前题目占位</div><div class="step"><span class="num">2</span>下一题占位</div><div class="step"><span class="num">3</span>后续题目占位</div><div class="step"><span class="num">…</span>剩余题目占位</div></div><button class="button" style="width:100%;margin-top:18px">结束并查看反馈</button></aside></div></div></main></div></body></html>
